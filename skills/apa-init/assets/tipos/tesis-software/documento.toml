# Configuración del documento. NO pongas aquí datos personales: usa {{CLAVE}} y el archivo .env.

[kit]
tipo = "tesis-software"
descripcion = "Tesis de ingeniería de sistemas o software: análisis, diseño, implementación y pruebas del sistema. Variante de tesis."
version_kit = "0"

[documento]
titulo = "[[Título de la tesis]]"
subtitulo = "Tesis para optar al título de {{GRADO}}"
salida = "Tesis"                         # dist/Tesis.docx
papel = "carta"                          # carta | a4 | oficio
fuente = "Times New Roman"               # APA 7 admite también Calibri 11 o Arial 11
tamano = 12
idioma = "es"                            # es, es-BO, es-MX, en-US…
justificar = false                       # APA 7 recomienda alineado a la izquierda
numerar_titulos = true                   # Capítulo N. / N.M. / N.M.K. automáticos (APA 7 no los exige; muchas facultades sí)
salto_nivel1 = true                      # cada título de nivel 1 empieza en página nueva
etiqueta_seccion = "Capítulo"            # palabra de las referencias @sec: («Capítulo 2»)
formato_capitulo = "Capítulo {n}. {titulo}"
niveles_indice = 3
etiqueta_tabla = "Tabla"                 # APA 7: Tabla. Si tu facultad pide "Cuadro", cámbialo aquí
etiqueta_figura = "Figura"               # APA 7: Figura. O "Gráfico", "Ilustración"…
logo = "recursos/logos/logo.png"         # opcional: si no existe, la portada sale sin logo
logo_ancho_cm = 4
meta_palabras = 20000                    # para --estado

[portada]
espacios_arriba = 1
lineas = [
  "{{AUTOR}}",
  "{{UNIVERSIDAD}}",
  "{{FACULTAD}} — {{CARRERA}}",
  "Tutor: {{TUTOR}}",
  "{{CIUDAD}}, {{FECHA}}",
]

[preliminares]
# portada · previos (capitulos/00-*.md) · indice · lista_tablas · lista_figuras
orden = ["portada", "previos", "indice", "lista_tablas", "lista_figuras"]

[variables]
# Valores NO personales reutilizables en los capítulos como {{CLAVE}} (el .env tiene prioridad).

NOMBRE_SISTEMA = "[[Nombre del sistema]]"
