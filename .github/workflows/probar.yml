name: probar

# Comprueba apa-kit en Windows, macOS y Linux, con el Python mínimo (3.9) y el actual.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  REQUISITOS: skills/apa-init/assets/scripts/requirements.txt

jobs:
  probar:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, python: "3.9" }    # ubuntu-latest ya no ofrece Python 3.9
          - { os: ubuntu-latest, python: "3.13" }
          - { os: windows-latest, python: "3.9" }
          - { os: windows-latest, python: "3.13" }
          - { os: macos-latest, python: "3.9" }
          - { os: macos-latest, python: "3.13" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Instalar librerías
        run: python -m pip install -r ${{ env.REQUISITOS }}
      - name: Prueba de humo (crear cada tipo, importar un Word, generar, sincronizar y migrar)
        run: python tests/prueba_humo.py

  # El Python del sistema de Debian/Ubuntu rechaza "pip install" (PEP 668): debe usar .apa/.venv solo.
  linux-python-del-sistema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y python3 python3-venv python3-pip
      - name: Crear un proyecto con el Python del sistema
        run: |
          mkdir "$RUNNER_TEMP/proyecto"
          cd "$RUNNER_TEMP/proyecto"
          python3 -B "$GITHUB_WORKSPACE/skills/apa-init/assets/scripts/iniciar.py" --tipo tesis --destino tesis
      - name: Instalar forzando el camino .venv (como en PEP 668)
        working-directory: ${{ runner.temp }}/proyecto
        run: python3 .apa/scripts/verificar_entorno.py --instalar --doc tesis
        env:
          APA_FORZAR_VENV: "1"
      - name: Generar dentro de .apa/.venv
        working-directory: ${{ runner.temp }}/proyecto
        run: python3 .apa/scripts/generar_docx.py --doc tesis
      - name: Confirmar que se creó .apa/.venv y el .docx
        working-directory: ${{ runner.temp }}/proyecto
        run: test -d .apa/.venv && test -f tesis/dist/Tesis.docx
