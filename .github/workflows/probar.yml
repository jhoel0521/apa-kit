name: probar

# Comprueba que la plantilla funciona en Windows, macOS y Linux, con el Python mínimo (3.9) y el actual.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  probar:
    # Solo en el repositorio oficial; en los proyectos que usen la plantilla no se ejecuta.
    if: github.repository == 'jhoel0521/plantilla-docs-apa'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, python: "3.9" }    # ubuntu-latest ya no ofrece Python 3.9
          - { os: ubuntu-latest, python: "3.13" }
          - { os: windows-latest, python: "3.9" }
          - { os: windows-latest, python: "3.13" }
          - { os: macos-latest, python: "3.9" }
          - { os: macos-latest, python: "3.13" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Verificar entorno e instalar librerías
        run: python scripts/verificar_entorno.py --instalar
      - name: Prueba de humo (importar un Word y generar el documento)
        run: python scripts/prueba_humo.py

  # El Python del sistema de Debian/Ubuntu rechaza "pip install" (PEP 668): debe usar .venv solo.
  linux-python-del-sistema:
    if: github.repository == 'jhoel0521/plantilla-docs-apa'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y python3 python3-venv python3-pip
      - name: Instalar con el Python del sistema, forzando el camino .venv (como en PEP 668)
        run: python3 scripts/verificar_entorno.py --instalar
        env:
          PLANTILLA_FORZAR_VENV: "1"
      - name: Prueba de humo dentro de .venv
        run: python3 scripts/prueba_humo.py
      - name: Confirmar que se creó .venv
        run: test -d .venv
