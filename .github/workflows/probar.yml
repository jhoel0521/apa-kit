name: probar

# Comprueba apa-kit en Windows, macOS y Linux, con el Python mínimo (3.9) y el actual.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  REQUISITOS: skills/apa-init/assets/scripts/requirements.txt

jobs:
  probar:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, python: "3.9" }    # ubuntu-latest ya no ofrece Python 3.9
          - { os: ubuntu-latest, python: "3.13" }
          - { os: windows-latest, python: "3.9" }
          - { os: windows-latest, python: "3.13" }
          - { os: macos-latest, python: "3.9" }
          - { os: macos-latest, python: "3.13" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Instalar librerías
        run: python -m pip install -r ${{ env.REQUISITOS }}
      - name: Prueba de humo (crear cada tipo, importar un Word, generar, sincronizar y migrar)
        run: python tests/prueba_humo.py

  # El Python del sistema de Debian/Ubuntu rechaza "pip install" (PEP 668): debe usar .apa/.venv solo.
  linux-python-del-sistema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y python3 python3-venv python3-pip
      - name: Crear un proyecto con DOS documentos usando el Python del sistema
        # Con dos documentos, --doc debe sobrevivir al relanzamiento dentro de .apa/.venv.
        run: |
          mkdir "$RUNNER_TEMP/proyecto"
          cd "$RUNNER_TEMP/proyecto"
          python3 -B "$GITHUB_WORKSPACE/skills/apa-init/assets/scripts/iniciar.py" --tipo tesis --destino tesis
          python3 -B "$GITHUB_WORKSPACE/skills/apa-init/assets/scripts/iniciar.py" --tipo articulo --destino articulo
      - name: Instalar forzando el camino .venv (como en PEP 668)
        working-directory: ${{ runner.temp }}/proyecto
        run: python3 .apa/scripts/verificar_entorno.py --instalar --doc tesis
        env:
          APA_FORZAR_VENV: "1"
      - name: Sin portada definida, el Word no se genera
        working-directory: ${{ runner.temp }}/proyecto
        run: "! python3 .apa/scripts/generar_docx.py --doc tesis"
      - name: Definir la portada (lo que haría la entrevista de apa-init)
        working-directory: ${{ runner.temp }}/proyecto
        run: sed -i 's/^bloques = \[\]$/bloques = [{ texto = "{{TITULO}}", negrita = true }, { texto = "{{AUTOR}}" }]/' tesis/documento.toml
      - name: Generar dentro de .apa/.venv
        working-directory: ${{ runner.temp }}/proyecto
        run: python3 .apa/scripts/generar_docx.py --doc tesis
      - name: Confirmar que se creó .apa/.venv y el .docx
        working-directory: ${{ runner.temp }}/proyecto
        run: test -d .apa/.venv && test -f tesis/dist/Tesis.docx

  # #9: Ubuntu con python3 pero SIN python3-venv ni pip. El intento fallido no debe dejar un .venv roto, y al
  # instalar python3-venv el segundo intento debe funcionar.
  linux-sin-venv:
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3 > /dev/null
      - name: Primer intento sin python3-venv
        run: |
          mkdir /tmp/p && cd /tmp/p
          python3 -B "$GITHUB_WORKSPACE/skills/apa-init/assets/scripts/iniciar.py" --tipo informe --destino informe
          python3 .apa/scripts/verificar_entorno.py --instalar --doc informe | tee salida.txt || true
          test ! -e .apa/.venv
          grep -q "python3-venv" salida.txt
          if grep -q "\['" salida.txt; then echo "el error sale como lista de Python"; exit 1; fi
      - name: Segundo intento con python3-venv instalado
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3-venv > /dev/null
          cd /tmp/p
          python3 .apa/scripts/verificar_entorno.py --instalar --doc informe
          test -d .apa/.venv
          python3 .apa/scripts/revisar.py --doc informe > /dev/null
